name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=llama_index.tools.happyhorse_acedatacloud --cov-report=term-missing
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: happyhorse-llamaindex-${{ matrix.python }}
          path: dist/*
      - name: Install the wheel as a consumer
        run: |
          python -m venv /tmp/happyhorse-consumer
          /tmp/happyhorse-consumer/bin/pip install dist/*.whl respx
          cd /tmp
          /tmp/happyhorse-consumer/bin/python "$GITHUB_WORKSPACE/examples/offline.py"
